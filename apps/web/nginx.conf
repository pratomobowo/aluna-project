server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API ke backend Hono (same-origin biar cookie session aman)
    location /api/ {
        proxy_pass https://tc8kkk08cgccw0sok88o4wcg.dev.usbypkp.ac.id;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        # Host harus domain API biar Traefik route ke container API
        proxy_set_header Host tc8kkk08cgccw0sok88o4wcg.dev.usbypkp.ac.id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
